<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080c">
<title>GC 3D LAB — 기체 크로마토그래피 구성과 원리</title>
  <script type="module" crossorigin src="./assets/index-Cma2V_0E.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DprxH9Ly.css">
</head>
<body>
<div id="app" class="bare">
  <header id="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"></span><div><b id="brand"></b><small id="brandsub"></small></div></div>
    <ol id="phases" aria-label="수업 단계"></ol>
    <div class="status">
      <span id="link" class="chip" title="수업 플랫폼 연결 상태"><i></i><span>단독 실행</span></span>
      <button id="btn-present" class="icon" title="발표 모드 (P)" aria-pressed="false">발표</button>
      <button id="btn-theme" class="icon" title="밝은 화면 / 어두운 화면">밝게</button>
      <button id="btn-full" class="icon" title="전체 화면 (F)">전체</button>
    </div>
  </header>

  <main id="stagewrap">
    <div id="stage"></div>
    <div id="vignette" aria-hidden="true"></div>
    <div id="labels" aria-hidden="true"></div>
    <div id="rail" role="toolbar" aria-label="3D 보기 도구">
      <button id="tool-xray" title="해부 보기 (X)"><b>해부</b><em id="xray-state">외장</em></button>
      <button id="tool-labels" title="이름표 (L)" aria-pressed="true"><b>이름표</b><em>켜짐</em></button>
      <label id="tool-explode" title="분해"><b>분해</b><input id="explode" type="range" min="0" max="1" step="0.01" value="0" aria-label="분해 정도"></label>
      <button id="tool-reset" title="시점 되돌리기"><b>시점</b><em>되돌리기</em></button>
    </div>
    <div id="partcard" role="status"><b></b><span></span></div>
    <div id="slate" aria-hidden="true"><span id="slate-kicker"></span><strong id="slate-title"></strong></div>
    <div id="caption" role="status"></div>
    <section id="titlecard" aria-live="polite"></section>
    <button id="dock-toggle" title="설명 창 접기/펴기" aria-expanded="true">설명 접기</button>
  </main>

  <aside id="dock" aria-label="장면 설명">
    <header id="dockhead"></header>
    <div id="dockbody"></div>
    <footer>외형: Agilent 7890B + 7693 사진(CC0) 참고 모델 · 내부 구조와 수치는 원리 설명용 모식입니다</footer>
  </aside>

  <nav id="transport" aria-label="장면 이동">
    <button id="prev">이전</button>
    <div id="scrub"></div>
    <span id="count"></span>
    <button id="next" class="go">다음</button>
  </nav>
</div>
</body>
</html>
