<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GC 3D 탐구 — 기체 크로마토그래피 구성과 원리</title>
<style>:root{--ink:#17202a;--muted:#5b6672;--line:#d9dee4;--accent:#1f6feb;--bg:#f3f4f2;--card:#fff}*{box-sizing:border-box}html,body{height:100%;color:var(--ink);background:var(--bg);margin:0;font-family:Noto Sans KR,Malgun Gothic,Apple SD Gothic Neo,system-ui,sans-serif}#app{grid-template-columns:minmax(0,1fr) 390px;height:100%;display:grid}#stage{min-height:0;position:relative}#stage canvas{touch-action:none;width:100%;height:100%;display:block}#toolbar{flex-wrap:wrap;align-items:center;gap:8px;display:flex;position:absolute;top:12px;left:12px}#toolbar button,#toolbar label{font:inherit;border:1px solid var(--line);background:var(--card);cursor:pointer;border-radius:8px;align-items:center;gap:6px;padding:8px 12px;font-size:14px;display:flex}#toolbar button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}#toolbar button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:#e3edff}#toolbar input[type=range]{width:110px}#partcard{border:1px solid var(--line);background:#fffffff2;border-radius:10px;max-width:340px;padding:10px 14px;font-size:14px;display:none;position:absolute;bottom:12px;left:12px}#partcard b{margin-bottom:2px;font-size:16px;display:block}#hint{color:var(--muted);background:#fffc;border-radius:6px;padding:4px 8px;font-size:12px;position:absolute;bottom:12px;right:12px}#panel{background:var(--card);border-left:1px solid var(--line);flex-direction:column;min-height:0;display:flex}#panel header{border-bottom:1px solid var(--line);padding:12px 16px 8px}#panel header h1{margin:0 0 8px;font-size:17px}#steps{grid-template-columns:repeat(3,1fr);gap:6px;display:grid}#steps button{font:inherit;border:1px solid var(--line);cursor:pointer;background:#fff;border-radius:8px;padding:7px 4px;font-size:13px}#steps button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}#body{flex:1;min-height:0;padding:14px 16px;overflow-y:auto}#body h2{margin:0 0 6px;font-size:18px;line-height:1.35}#body p.role{margin:0 0 10px;line-height:1.55}#body ul{margin:0 0 12px;padding-left:18px;font-size:14.5px;line-height:1.6}.question{background:#fff7e0;border:1px solid #f0d58a;border-radius:8px;margin:4px 0 12px;padding:9px 12px;font-size:14px}.question b{color:#8a6400;margin-bottom:2px;font-size:12px;display:block}#detbox{border-top:1px solid var(--line);margin-bottom:12px;padding-top:12px;display:none}#dettabs{grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;display:grid}#dettabs button{font:inherit;border:1px solid var(--line);cursor:pointer;background:#fff;border-radius:8px;padding:8px 0;font-weight:700}#dettabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}#detinfo{font-size:14px;line-height:1.55}#detinfo h3{margin:0 0 6px;font-size:16px}#detinfo dl{grid-template-columns:104px 1fr;gap:3px 8px;margin:0;display:grid}#detinfo dt{color:var(--muted)}#detinfo dd{margin:0}#detinfo .analogy{background:#eef4ff;border-radius:8px;margin-top:8px;padding:8px 10px}.charttitle{color:var(--muted);justify-content:space-between;margin:0 0 4px;font-size:13px;display:flex}canvas.chart{border:1px solid var(--line);background:#fbfcfd;border-radius:8px;width:100%;display:block}#legend{flex-wrap:wrap;gap:4px 12px;margin:6px 0 12px;font-size:12.5px;display:flex}#legend i{border-radius:50%;width:10px;height:10px;margin-right:4px;display:inline-block}#compare{display:none}#compare .row{cursor:pointer;grid-template-columns:44px 1fr;align-items:center;gap:6px;margin-bottom:4px;display:grid}#compare .row b{font-size:13px}#compare .row.on canvas{border-color:var(--ink);border-width:2px}footer{color:var(--muted);border-top:1px solid var(--line);padding:6px 16px 10px;font-size:11px}@media (width<=900px){#app{grid-template-rows:52vh 1fr;grid-template-columns:1fr}#panel{border-left:0;border-top:1px solid var(--line)}}</style>
  <script type="module" crossorigin src="./assets/index-Qmdc_rAB.js"></script>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="toolbar">
      <button id="inject" class="primary">▶ 시료 주입</button>
      <button id="xray" aria-pressed="false">해부 보기</button>
      <button id="labels" aria-pressed="true">이름표</button>
      <label>분해 <input id="explode" type="range" min="0" max="1" step="0.01" value="0"></label>
    </div>
    <div id="partcard"><b></b><span></span></div>
    <div id="hint">끌기: 돌려 보기 · 휠/두 손가락: 확대 · 부품 누르기: 설명</div>
  </div>
  <aside id="panel">
    <header>
      <h1>GC 3D 탐구 · 구성과 원리</h1>
      <div id="steps"></div>
    </header>
    <div id="body">
      <h2 id="title"></h2>
      <p class="role" id="role"></p>
      <ul id="points"></ul>
      <div id="detbox">
        <div id="dettabs"></div>
        <div id="detinfo"></div>
      </div>
      <p class="charttitle"><span id="charttitle">크로마토그램</span><span id="clock"></span></p>
      <canvas class="chart" id="chart" width="700" height="230"></canvas>
      <div id="legend"></div>
      <div id="compare">
        <p class="charttitle"><span>같은 시료, 네 가지 검출기 비교 (눌러서 바꾸기)</span></p>
        <div id="comparerows"></div>
      </div>
      <div class="question"><b>생각해 보기</b><span id="question"></span></div>
    </div>
    <footer>외형: Agilent 7890B + 7693 사진(CC0)을 참고한 코드 생성 모델 · 내부 구조와 입자는 원리 설명용 모식도</footer>
  </aside>
</div>
</body>
</html>
